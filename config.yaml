# Spend Desk assumptions. Every value here is an assumption, not a measured fact.

pricing:
  # ASSUMPTION: list price per credit. Real rates vary by edition, region and contract.
  dollars_per_credit: 3.00

calendar:
  # Fiscal year starts Feb 1 (FY27 = Feb 2026 to Jan 2027).
  fiscal_year_start_month: 2
  history_start: "2025-03-16"
  # As-of date for the QBR. Mid Q3 FY27, so quarter to date and projected quarter end are both meaningful.
  as_of: "2026-09-15"

data:
  seed: 42
  n_warehouses: 25
  # Fraction of queries kept in the synthetic QUERY_HISTORY sample.
  query_sample_rate: 0.10

forecast:
  horizon_days: 90
  backtest_folds: 6
  backtest_step_days: 14
  interval_level: 0.80

evaluation:
  # Anomaly thresholds are tuned on validation and reported on holdout.
  validation_start: "2025-09-16"
  holdout_start: "2026-03-16"

budget:
  # ASSUMPTION: the FY27 plan was set on plan_date from each team's trailing run rate,
  # grown quarter over quarter at the planned rates below. It knows nothing that happened later.
  plan_date: "2026-01-31"
  base_window_days: 90
  fiscal_year: 27
  quarterly_growth:
    Data Platform: 0.06
    ML Training: 0.06
    Product Analytics: 0.05
    Finance BI: 0.03
    GTM Ops: 0.03
    Customer Data: 0.06

anomaly:
  # Placeholders. Tuned on the validation window in Phase 4.
  robust_z_threshold: 3.5
  min_dollar_impact: 50
  level_shift_confirm_days: 7

teams:
  - Data Platform
  - ML Training
  - Product Analytics
  - Finance BI
  - GTM Ops
  - Customer Data

snowflake:
  database: SPEND_DESK
  warehouse: SPEND_DESK_WH
  role: SPEND_DESK_ROLE
