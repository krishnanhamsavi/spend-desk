[project]
name = "spend-desk"
version = "0.1.0"
description = "Agentic cloud spend copilot on Snowflake, built on synthetic ACCOUNT_USAGE shaped data"
requires-python = ">=3.11,<3.12"
dependencies = [
    "duckdb>=1.1",
    "pandas>=2.2",
    "numpy>=1.26",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "statsmodels>=0.14",
    "snowflake-snowpark-python>=1.20",
    "snowflake-connector-python[pandas]>=3.12",
    "cryptography>=42",
    "anthropic>=0.40",
    "streamlit>=1.39",
    "altair>=5.4",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.7"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
